{% extends "base.html" %}

{% block content %}

<section class="admin-page">
    <h1>All Users</h1>

    <table class="users-table">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Points</th>
                <th>Admin</th>
                <th>Joined</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user['username'] }}</td>
                <td>{{ user['email'] }}</td>
                <td>{{ user['points'] }}</td>
                <td>{{ "Yes" if user['is_admin'] else "No" }}</td>
                <td>{{ user['created_at'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>

{% endblock %}
